name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          extensions: sqlite3, pdo_sqlite

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Ensure SQLite database file exists
        run: touch database/database.sqlite

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Trigger Laravel Forge Deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl -sS "${FORGE_DEPLOY_HOOK}"
        env:
          FORGE_DEPLOY_HOOK: ${{ secrets.FORGE_DEPLOY_HOOK || 'https://forge.laravel.com/servers/768845/sites/3345175/deploy/http?token=fLpRNgLdADY9Swb8zzgrY0Jz183gpFzf55EqPbAa' }}


